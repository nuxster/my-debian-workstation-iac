# Debian 13 (trixie) preseed file for a minimal workstation base.
#
# Installs the base system only (no tasks), English (en_US.UTF-8), US mirror,
# guided partitioning of the whole disk with LVM inside LUKS, no NTP,
# no root login (the created user gets sudo), GRUB on the boot disk,
# no popularity-contest. The rest is done by the Ansible playbook afterwards.
#
# Placeholders to replace before use: USERNAME, FULL NAME, PASSWORD HASH.
# Usage is described in README.md ("Automated installation").

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i keyboard-configuration/xkb-keymap select us

### Network
# Pick the first interface with a link (wired is preferred). On a Wi-Fi-only
# machine uncomment the wireless block below.
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 60

# Wi-Fi (WPA/WPA2 PSK). These keys matter only when the preseed file is
# available locally (initrd/USB): when it is fetched over the network, the
# network is already up by the time the file is read, so pass the same values
# on the kernel command line instead.
#d-i netcfg/wireless_essid string MyNetwork
#d-i netcfg/wireless_essid_again string MyNetwork
#d-i netcfg/wireless_security_type select wpa
#d-i netcfg/wireless_wpa string MyPassphrase

d-i netcfg/get_hostname string debian-host
d-i netcfg/get_domain string domain.local
d-i netcfg/wireless_wep string
# Load non-free firmware (Wi-Fi, GPU) from the installation media if needed
d-i hw-detect/load_firmware boolean true

### Mirror (United States, GeoDNS CDN)
d-i mirror/country string US
d-i mirror/http/mirror select deb.debian.org
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts
# No root login: the regular user is created and added to the sudo group
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string FULL NAME
d-i passwd/username string USERNAME
# Generate the hash with:  openssl passwd -6
d-i passwd/user-password-crypted password PASSWORD HASH
# Or, less securely, a plain-text password instead of the hash:
#d-i passwd/user-password password insecure
#d-i passwd/user-password-again password insecure
d-i passwd/user-default-groups string audio cdrom video plugdev netdev

### Clock
# Hardware clock keeps UTC, time zone UTC (Ansible sets the real one),
# no NTP time sync during the installation
d-i clock-setup/utc boolean false
d-i time/zone string Europe/Moscow
d-i clock-setup/ntp boolean false

### Partitioning: whole disk, LVM inside an encrypted (LUKS) partition
# With a single disk the installer picks it automatically; otherwise set it:
d-i partman-auto/disk string /dev/nvme1n1
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
# The LUKS passphrase is asked interactively (it is the only question left).
# To preseed it as well, uncomment both lines:
d-i partman-crypto/passphrase password CHANGEME
d-i partman-crypto/passphrase-again password CHANGEME
# Skip the slow wipe of the disk before encrypting it (set true for a wipe)
d-i partman-auto-crypto/erase_disks boolean false

# Silence the confirmations
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system and APT
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

### Package selection: minimal system, no tasks at all
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note
